  <script>
    const rawMd = "# \ud83d\udcdd Benchmark Questions: Question 2 & Question 5\n### *The Raw Question Formulations Under Both Benchmark Methods*\n\n---\n\n## Question 2: Thermal Velocity & Equipartition\n\n* **Method 1 (Closed Hypothesis Verification)**:  \n  > *\"Lowering the temperature of an aqueous solution increases the root-mean-square thermal velocity of dissolved proteins like lysozyme.\"*  \n  > **Ground Truth Verdict**: `REFUTED`\n\n* **Method 2 (Open Mechanistic Research Query)**:  \n  > *\"According to equipartition theory, what is the thermal kinetic energy per spatial degree of freedom for microscopic particles in aqueous suspension, and how does thermal velocity scale with temperature?\"*\n\n* **Reference**: Howard C. Berg, *Random Walks in Biology* (1993), Chapter 1, Page 2.\n\n---\n\n## Question 5: Passive Diffusion vs. ATP Hydrolysis\n\n* **Method 1 (Closed Hypothesis Verification)**:  \n  > *\"Passive diffusion across a lipid bilayer requires direct metabolic input from ATP hydrolysis.\"*  \n  > **Ground Truth Verdict**: `REFUTED`\n\n* **Method 2 (Open Mechanistic Research Query)**:  \n  > *\"How does the thermodynamic driving force for passive diffusion across a biological lipid bilayer differ from active transport, and does passive permeation require direct coupling to metabolic ATP hydrolysis?\"*\n\n* **Reference**: Bruce Alberts et al., *Molecular Biology of the Cell*, 7th ed. (2022), Chapter 11, Section 11-1, Pages 678\u2013679.\n";

    renderMathInElement(document.body, {
